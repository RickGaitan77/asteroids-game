<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asteroids Classic Vector Arcade</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&display=swap');
        body {
            font-family: 'Orbitron', sans-serif;
            background-color: #030712;
            color: #00ffff;
            overflow: hidden;
            touch-action: none;
        }
        canvas {
            display: block;
            background: #030712;
        }
        .arcade-glow {
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.6), 0 0 20px rgba(0, 255, 255, 0.3);
        }
        .arcade-glow-rose {
            text-shadow: 0 0 10px rgba(255, 51, 102, 0.6), 0 0 20px rgba(255, 51, 102, 0.3);
        }
    </style>
</head>
<body class="relative w-screen h-screen flex flex-col items-center justify-between select-none">

    <header class="absolute top-0 left-0 w-full p-4 flex justify-between items-center z-20 pointer-events-none bg-gradient-to-b from-gray-950/90 to-transparent">
        <div class="flex items-center space-x-6">
            <div>
                <span class="text-xs text-cyan-500 block tracking-widest">SCORE</span>
                <span id="scoreVal" class="text-xl md:text-2xl font-black text-cyan-300 tracking-wider arcade-glow">000000</span>
            </div>
            <div>
                <span class="text-xs text-cyan-500 block tracking-widest">HIGH SCORE</span>
                <span id="highScoreVal" class="text-xl md:text-2xl font-black text-cyan-400 tracking-wider">000000</span>
            </div>
        </div>
        <div class="flex items-center space-x-6">
            <div class="text-center">
                <span class="text-xs text-cyan-500 block tracking-widest">WAVE</span>
                <span id="waveVal" class="text-xl md:text-2xl font-black text-cyan-300 tracking-wider arcade-glow">1</span>
            </div>
            <div class="flex flex-col items-end">
                <span class="text-xs text-cyan-500 block tracking-widest mb-1">SHIPS</span>
                <div id="livesContainer" class="flex space-x-2"></div>
            </div>
        </div>
    </header>

    <main class="relative w-full h-full flex-grow">
        <canvas id="gameCanvas" class="w-full h-full"></canvas>
    </main>

    <div id="startScreen" class="absolute inset-0 z-30 flex flex-col items-center justify-center bg-gray-950/95 p-6 backdrop-blur-md">
        <div class="text-center max-w-lg space-y-6">
            <h1 class="text-4xl md:text-6xl font-black text-cyan-400 tracking-wider arcade-glow animate-pulse">ASTEROIDS</h1>
            <p class="text-xs md:text-sm text-cyan-600 tracking-widest uppercase">Classic Vector Arcade Edition</p>
            
            <!-- Difficulty Selector -->
            <div class="space-y-2 pt-2">
                <span class="text-xs text-cyan-400 font-semibold tracking-wider block">SELECT DIFFICULTY</span>
                <div class="grid grid-cols-3 gap-3">
                    <button data-diff="normal" class="diff-btn py-2 px-3 border border-cyan-500 bg-cyan-950 text-cyan-300 font-bold rounded text-xs tracking-wider ring-2 ring-cyan-400 transition transform hover:scale-105">NORMAL</button>
                    <button data-diff="crazy" class="diff-btn py-2 px-3 border border-cyan-800 bg-gray-950/60 text-cyan-600 font-bold rounded text-xs tracking-wider transition transform hover:scale-105">CRAZY</button>
                    <button data-diff="insane" class="diff-btn py-2 px-3 border border-cyan-800 bg-gray-950/60 text-cyan-600 font-bold rounded text-xs tracking-wider transition transform hover:scale-105">INSANE</button>
                </div>
            </div>

            <div class="bg-gray-900/80 border border-cyan-900/60 rounded-xl p-4 text-xs text-cyan-300/80 space-y-2 text-left">
                <div class="flex justify-between"><span>Rotate:</span><span class="text-cyan-400 font-bold">Left / Right Arrows (A / D)</span></div>
                <div class="flex justify-between"><span>Thrust:</span><span class="text-cyan-400 font-bold">Up Arrow (W)</span></div>
                <div class="flex justify-between"><span>Fire Laser:</span><span class="text-cyan-400 font-bold">Spacebar</span></div>
                <div class="flex justify-between"><span>Hyperspace:</span><span class="text-cyan-400 font-bold">H Key</span></div>
            </div>
            <button id="startBtn" class="w-full py-4 bg-cyan-500 hover:bg-cyan-400 text-gray-950 font-black text-lg tracking-widest rounded-xl shadow-lg shadow-cyan-500/30 transition transform hover:scale-105 active:scale-95">INITIATE LAUNCH</button>
        </div>
    </div>

    <div id="gameOverScreen" class="absolute inset-0 z-30 hidden flex flex-col items-center justify-center bg-gray-950/95 p-6 backdrop-blur-md">
        <div class="text-center max-w-md space-y-6">
            <h2 class="text-4xl md:text-5xl font-black text-rose-500 tracking-wider arcade-glow-rose">GAME OVER</h2>
            <div class="bg-gray-900/80 border border-rose-900/50 rounded-xl p-5 space-y-3">
                <div class="flex justify-between text-sm"><span class="text-gray-400">FINAL SCORE</span><span id="finalScore" class="font-bold text-cyan-300">000000</span></div>
                <div class="flex justify-between text-sm"><span class="text-gray-400">WAVES SURVIVED</span><span id="finalWave" class="font-bold text-cyan-300">1</span></div>
            </div>
            <button id="restartBtn" class="w-full py-4 bg-rose-600 hover:bg-rose-500 text-white font-black text-lg tracking-widest rounded-xl shadow-lg shadow-rose-600/30 transition transform hover:scale-105 active:scale-95">PLAY AGAIN</button>
        </div>
    </div>

    <div id="mobileControls" class="absolute bottom-4 left-4 right-4 flex justify-between items-end z-20 md:hidden pointer-events-none">
        <div class="flex space-x-3 pointer-events-auto">
            <button id="btnLeft" class="w-14 h-14 bg-gray-900/80 border border-cyan-500/50 rounded-full flex items-center justify-center text-cyan-400 text-xl font-bold active:bg-cyan-950 shadow-lg">◄</button>
            <button id="btnRight" class="w-14 h-14 bg-gray-900/80 border border-cyan-500/50 rounded-full flex items-center justify-center text-cyan-400 text-xl font-bold active:bg-cyan-950 shadow-lg">►</button>
        </div>
        <div class="flex space-x-3 pointer-events-auto">
            <button id="btnHyperspace" class="w-14 h-14 bg-gray-900/80 border border-purple-500/50 rounded-full flex items-center justify-center text-purple-400 text-xs font-bold active:bg-purple-950 shadow-lg">HYPER</button>
            <button id="btnThrust" class="w-14 h-14 bg-gray-900/80 border border-cyan-500/50 rounded-full flex items-center justify-center text-cyan-400 text-xs font-bold active:bg-cyan-950 shadow-lg">THRUST</button>
            <button id="btnFire" class="w-16 h-16 bg-cyan-600/90 border border-cyan-300 rounded-full flex items-center justify-center text-gray-950 font-black text-xs active:bg-cyan-400 shadow-lg">FIRE</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let gameStarted = false;
        let gameOver = false;
        let score = 0;
        let highScore = localStorage.getItem('asteroids_highScore') ? parseInt(localStorage.getItem('asteroids_highScore')) : 0;
        let lives = 3;
        let wave = 1;
        let currentDifficulty = 'normal';
        let nextExtraLifeScore = 10000;

        // Web Audio API Context for Procedural Sound Effects
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            try {
                if (type === 'laser') {
                    // Laser sound: quick frequency drop chirp
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.15);
                } else if (type === 'explosion') {
                    // Explosion sound: noise buffer or low rumble
                    const bufferSize = audioCtx.sampleRate * 0.4;
                    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        data[i] = Math.random() * 2 - 1;
                    }
                    const noise = audioCtx.createBufferSource();
                    noise.buffer = buffer;
                    const filter = audioCtx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(400, audioCtx.currentTime);
                    filter.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 0.4);
                    const gain = audioCtx.createGain();
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                    noise.connect(filter);
                    filter.connect(gain);
                    gain.connect(audioCtx.destination);
                    noise.start();
                } else if (type === 'thrust') {
                    // Subtle white noise burst for engine thrust
                    const bufferSize = audioCtx.sampleRate * 0.08;
                    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        data[i] = (Math.random() * 2 - 1) * 0.5;
                    }
                    const noise = audioCtx.createBufferSource();
                    noise.buffer = buffer;
                    const filter = audioCtx.createBiquadFilter();
                    filter.type = 'bandpass';
                    filter.frequency.setValueAtTime(300, audioCtx.currentTime);
                    const gain = audioCtx.createGain();
                    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
                    noise.connect(filter);
                    filter.connect(gain);
                    gain.connect(audioCtx.destination);
                    noise.start();
                } else if (type === 'hyperspace') {
                    // Sci-fi sweep
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.3);
                }
            } catch(e) {
                // Ignore audio context autoplay blocks prior to user gesture
            }
        }

        const highScoreValEl = document.getElementById('highScoreVal');
        if (highScoreValEl) highScoreValEl.textContent = String(highScore).padStart(6, '0');

        let ship;
        let bullets = [];
        let asteroids = [];
        let particles = [];
        let stars = [];

        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const scoreValEl = document.getElementById('scoreVal');
        const livesContainer = document.getElementById('livesContainer');
        const waveValEl = document.getElementById('waveVal');
        const finalScoreEl = document.getElementById('finalScore');
        const finalWaveEl = document.getElementById('finalWave');

        const keys = {
            ArrowLeft: false,
            ArrowRight: false,
            ArrowUp: false,
            KeyA: false,
            KeyD: false,
            KeyW: false,
            Space: false,
            KeyH: false
        };

        let touchLeft = false;
        let touchRight = false;
        let touchThrust = false;

        class Particle {
            constructor(x, y, vx, vy, life, color) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.life = life;
                this.maxLife = life;
                this.color = color;
            }
            update(dt) {
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                this.life -= dt;
            }
            draw() {
                ctx.save();
                ctx.strokeStyle = this.color;
                ctx.globalAlpha = Math.max(0, this.life / this.maxLife);
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x - this.vx * 0.05, this.y - this.vy * 0.05);
                ctx.stroke();
                ctx.restore();
            }
        }

        class Ship {
            constructor() {
                this.x = canvas.width / 2;
                this.y = canvas.height / 2;
                this.r = 19; // Slightly bigger ship
                this.angle = -Math.PI / 2;
                this.rotationSpeed = 3.8;
                this.vx = 0;
                this.vy = 0;
                this.thrustPower = 380;
                this.friction = 0.985;
                this.isThrusting = false;
                this.invulnerableTimer = 3;
            }
            update(dt) {
                if (keys.ArrowLeft || keys.KeyA || touchLeft) this.angle -= this.rotationSpeed * dt;
                if (keys.ArrowRight || keys.KeyD || touchRight) this.angle += this.rotationSpeed * dt;

                this.isThrusting = false;
                if (keys.ArrowUp || keys.KeyW || touchThrust) {
                    this.vx += Math.cos(this.angle) * this.thrustPower * dt;
                    this.vy += Math.sin(this.angle) * this.thrustPower * dt;
                    this.isThrusting = true;

                    if (Math.random() < 0.6) {
                        const backX = this.x - Math.cos(this.angle) * this.r;
                        const backY = this.y - Math.sin(this.angle) * this.r;
                        particles.push(new Particle(
                            backX, backY,
                            -Math.cos(this.angle) * 120 + (Math.random() - 0.5) * 40,
                            -Math.sin(this.angle) * 120 + (Math.random() - 0.5) * 40,
                            0.3 + Math.random() * 0.2,
                            '#00ffff'
                        ));
                    }
                }

                this.vx *= Math.pow(this.friction, dt * 60);
                this.vy *= Math.pow(this.friction, dt * 60);

                this.x += this.vx * dt;
                this.y += this.vy * dt;

                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;

                if (this.invulnerableTimer > 0) this.invulnerableTimer -= dt;
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                if (this.invulnerableTimer <= 0 || Math.floor(Date.now() / 100) % 2 === 0) {
                    ctx.strokeStyle = '#00ffff';
                    ctx.shadowColor = '#00ffff';
                    ctx.shadowBlur = 8;
                    ctx.lineWidth = 2.5;
                    ctx.fillStyle = '#050a14';

                    ctx.beginPath();
                    ctx.moveTo(this.r * 1.3, 0);
                    ctx.lineTo(-this.r * 0.9, -this.r * 0.85);
                    ctx.lineTo(-this.r * 0.4, 0);
                    ctx.lineTo(-this.r * 0.9, this.r * 0.85);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();

                    if (this.isThrusting) {
                        ctx.strokeStyle = '#ff5500';
                        ctx.shadowColor = '#ff5500';
                        ctx.beginPath();
                        ctx.moveTo(-this.r * 0.5, -this.r * 0.4);
                        ctx.lineTo(-this.r * 1.3, 0);
                        ctx.lineTo(-this.r * 0.5, this.r * 0.4);
                        ctx.stroke();
                    }
                }
                ctx.restore();
            }
        }

        class Bullet {
            constructor(x, y, angle) {
                this.x = x;
                this.y = y;
                const speed = 780;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.life = 1.1;
                this.r = 4.5;
            }
            update(dt) {
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                this.life -= dt;

                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
            }
            draw() {
                ctx.save();
                // Changed from yellow to a warm golden amber
                ctx.fillStyle = '#ffaa00';
                ctx.shadowColor = '#ffaa00';
                ctx.shadowBlur = 9;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class Asteroid {
            constructor(x, y, radius, tier, isBehemoth = false, speedMult = 1.0) {
                this.x = x;
                this.y = y;
                this.r = radius;
                this.tier = tier;
                this.isBehemoth = isBehemoth;
                
                let baseSpeed;
                if (this.isBehemoth) {
                    baseSpeed = (0.6 + Math.random() * 0.5) * speedMult;
                } else if (this.tier === 4) {
                    baseSpeed = (1.2 + Math.random() * 0.8) * speedMult;
                } else {
                    baseSpeed = ((4 - this.tier) * 3.5 + Math.random() * 3.0) * speedMult;
                }

                const waveSpeedBonus = (wave - 1) * 0.18 * speedMult; 
                const speed = Math.max(1.8, baseSpeed + waveSpeedBonus);
                
                const moveAngle = Math.random() * Math.PI * 2;
                this.vx = Math.cos(moveAngle) * speed;
                this.vy = Math.sin(moveAngle) * speed;

                this.rotSpeed = (Math.random() - 0.5) * 0.6;
                this.angle = Math.random() * Math.PI * 2;

                this.vertices = [];
                const numVerts = Math.floor(Math.random() * 5) + 9;
                for (let i = 0; i < numVerts; i++) {
                    const angle = (i / numVerts) * Math.PI * 2;
                    const jitter = this.r * (0.78 + Math.random() * 0.44);
                    this.vertices.push({
                        x: Math.cos(angle) * jitter,
                        y: Math.sin(angle) * jitter
                    });
                }
            }
            update(dt) {
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                this.angle += this.rotSpeed * dt;

                if (this.x < -this.r) this.x = canvas.width + this.r;
                if (this.x > canvas.width + this.r) this.x = -this.r;
                if (this.y < -this.r) this.y = canvas.height + this.r;
                if (this.y > canvas.height + this.r) this.y = -this.r;
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                
                if (this.isBehemoth || this.tier === 4) {
                    ctx.strokeStyle = '#ff33aa';
                    ctx.shadowColor = '#ff00aa';
                    ctx.shadowBlur = 12;
                } else {
                    // Dynamic coloring based on difficulty setting
                    if (currentDifficulty === 'insane') {
                        ctx.strokeStyle = '#ff3333';
                        ctx.shadowColor = '#ff0000';
                        ctx.shadowBlur = 6;
                    } else if (currentDifficulty === 'crazy') {
                        ctx.strokeStyle = '#ff9900';
                        ctx.shadowColor = '#ff6600';
                        ctx.shadowBlur = 5;
                    } else {
                        ctx.strokeStyle = '#00ffff';
                        ctx.shadowColor = '#00ffff';
                        ctx.shadowBlur = 4;
                    }
                }
                
                ctx.lineWidth = 2;
                ctx.fillStyle = '#050a14';

                ctx.beginPath();
                ctx.moveTo(this.vertices[0].x, this.vertices[0].y);
                for (let i = 1; i < this.vertices.length; i++) {
                    ctx.lineTo(this.vertices[i].x, this.vertices[i].y);
                }
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                ctx.restore();
            }
        }

        function spawnWave() {
            asteroids = [];
            
            let baseCountMultiplier = 1;
            let speedMultiplier = 1;
            let behemothChance = 0.3;
            
            // Explicitly tuned difficulty tiers for proper progression
            if (currentDifficulty === 'normal') {
                baseCountMultiplier = 1.0;
                speedMultiplier = 1.25; // Noticeably livelier than baseline
                behemothChance = 0.25;
            } else if (currentDifficulty === 'crazy') {
                baseCountMultiplier = 1.5;
                speedMultiplier = 1.7; // Noticeably faster & harder
                behemothChance = 0.5;
            } else if (currentDifficulty === 'insane') {
                baseCountMultiplier = 2.2; // Lots more initial meteorites
                speedMultiplier = 2.3; // Very fast & challenging
                behemothChance = 0.75;
            }

            const numAsteroids = Math.min(Math.floor((3 + Math.floor(wave * 0.75)) * baseCountMultiplier), currentDifficulty === 'insane' ? 24 : 16);
            
            for (let i = 0; i < numAsteroids; i++) {
                let x, y;
                do {
                    x = Math.random() * canvas.width;
                    y = Math.random() * canvas.height;
                } while (Math.hypot(x - ship.x, y - ship.y) < 280);

                let radius = 45;
                let tier = 3;
                let isBehemoth = false;

                const sizeRoll = Math.random();
                if (sizeRoll < 0.12 && wave >= 2 && Math.random() < behemothChance) {
                    radius = 90;
                    tier = 4;
                    isBehemoth = true;
                } else if (sizeRoll < 0.4) {
                    radius = 22 + Math.random() * 14;
                } else if (sizeRoll < 0.75) {
                    radius = 38 + Math.random() * 16;
                } else {
                    radius = 56 + Math.random() * 12;
                }

                asteroids.push(new Asteroid(x, y, radius, tier, isBehemoth, speedMultiplier));
            }
        }

        function hyperspace() {
            if (!gameStarted || gameOver) return;
            playSound('hyperspace');
            ship.x = Math.random() * canvas.width;
            ship.y = Math.random() * canvas.height;
            ship.vx = 0;
            ship.vy = 0;
            ship.invulnerableTimer = 1.0;
            for (let i = 0; i < 15; i++) {
                particles.push(new Particle(
                    ship.x, ship.y,
                    (Math.random() - 0.5) * 150,
                    (Math.random() - 0.5) * 150,
                    0.4,
                    '#ff00ff'
                ));
            }
        }

        function createDebris(x, y, color) {
            for (let i = 0; i < 10; i++) {
                particles.push(new Particle(
                    x, y,
                    (Math.random() - 0.5) * 200,
                    (Math.random() - 0.5) * 200,
                    0.5 + Math.random() * 0.4,
                    color
                ));
            }
        }

        function updateHUD() {
            scoreValEl.textContent = String(score).padStart(6, '0');
            waveValEl.textContent = wave;
            
            livesContainer.innerHTML = '';
            for (let i = 0; i < lives; i++) {
                const lifeIcon = document.createElement('div');
                lifeIcon.className = 'w-3 h-4 border-t border-cyan-400 border-l border-r bg-cyan-950/80 rotate-180 transform';
                livesContainer.appendChild(lifeIcon);
            }
        }

        function startGame() {
            initAudio();
            gameStarted = true;
            gameOver = false;
            score = 0;
            lives = 3;
            wave = 1;
            nextExtraLifeScore = 10000;
            ship = new Ship();
            bullets = [];
            particles = [];
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            spawnWave();
            updateHUD();
        }

        function triggerGameOver() {
            gameOver = true;
            finalScoreEl.textContent = String(score).padStart(6, '0');
            finalWaveEl.textContent = wave;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('asteroids_highScore', highScore);
                if (highScoreValEl) highScoreValEl.textContent = String(highScore).padStart(6, '0');
            }
            gameOverScreen.classList.remove('hidden');
        }

        // Keyboard Event Listeners
        window.addEventListener('keydown', e => {
            initAudio();
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.ArrowLeft = true;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.ArrowRight = true;
            if (e.code === 'ArrowUp' || e.code === 'KeyW') keys.ArrowUp = true;
            if (e.code === 'KeyH') hyperspace();
            if (e.code === 'Space') {
                e.preventDefault();
                if (gameStarted && !gameOver && ship) {
                    playSound('laser');
                    const tipX = ship.x + Math.cos(ship.angle) * (ship.r * 1.3);
                    const tipY = ship.y + Math.sin(ship.angle) * (ship.r * 1.3);
                    bullets.push(new Bullet(tipX, tipY, ship.angle));
                }
            }
        });

        window.addEventListener('keyup', e => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.ArrowLeft = false;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.ArrowRight = false;
            if (e.code === 'ArrowUp' || e.code === 'KeyW') keys.ArrowUp = false;
        });

        // UI Controls
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

        const diffButtons = document.querySelectorAll('.diff-btn');
        diffButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                diffButtons.forEach(b => {
                    b.classList.remove('border-cyan-500', 'bg-cyan-950', 'text-cyan-300', 'ring-2', 'ring-cyan-400');
                    b.classList.add('border-cyan-800', 'bg-gray-950/60', 'text-cyan-600');
                });
                const selected = e.currentTarget;
                currentDifficulty = selected.getAttribute('data-diff');
                selected.classList.remove('border-cyan-800', 'bg-gray-950/60', 'text-cyan-600');
                selected.classList.add('border-cyan-500', 'bg-cyan-950', 'text-cyan-300', 'ring-2', 'ring-cyan-400');
            });
        });

        // Touch Control Bindings
        const bindTouch = (elem, onStart, onEnd) => {
            elem.addEventListener('touchstart', e => { e.preventDefault(); initAudio(); onStart(); });
            elem.addEventListener('touchend', e => { e.preventDefault(); onEnd(); });
            elem.addEventListener('mousedown', e => { e.preventDefault(); initAudio(); onStart(); });
            elem.addEventListener('mouseup', e => { e.preventDefault(); onEnd(); });
        };

        bindTouch(document.getElementById('btnLeft'), () => touchLeft = true, () => touchLeft = false);
        bindTouch(document.getElementById('btnRight'), () => touchRight = true, () => touchRight = false);
        bindTouch(document.getElementById('btnThrust'), () => touchThrust = true, () => touchThrust = false);
        document.getElementById('btnHyperspace').addEventListener('click', () => { initAudio(); hyperspace(); });
        document.getElementById('btnFire').addEventListener('click', () => {
            initAudio();
            if (gameStarted && !gameOver && ship) {
                playSound('laser');
                const tipX = ship.x + Math.cos(ship.angle) * (ship.r * 1.3);
                const tipY = ship.y + Math.sin(ship.angle) * (ship.r * 1.3);
                bullets.push(new Bullet(tipX, tipY, ship.angle));
            }
        });

        // Initialize Background Stars & Preview Ship
        ship = new Ship();
        for (let i = 0; i < 35; i++) {
            stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, size: Math.random() * 1.5, alpha: Math.random() });
        }

        let lastTime = performance.now();
        function gameLoop(now) {
            const dt = Math.min((now - lastTime) / 1000, 0.1);
            lastTime = now;

            ctx.fillStyle = '#030712';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#ffffff';
            for (let star of stars) {
                ctx.globalAlpha = star.alpha;
                ctx.fillRect(star.x, star.y, star.size, star.size);
            }
            ctx.globalAlpha = 1.0;

            if (gameStarted && !gameOver) {
                ship.update(dt);

                for (let i = bullets.length - 1; i >= 0; i--) {
                    bullets[i].update(dt);
                    if (bullets[i].life <= 0) bullets.splice(i, 1);
                }

                for (let ast of asteroids) ast.update(dt);

                for (let i = particles.length - 1; i >= 0; i--) {
                    particles[i].update(dt);
                    if (particles[i].life <= 0) particles.splice(i, 1);
                }

                // Bullet-Asteroid Collision
                for (let i = bullets.length - 1; i >= 0; i--) {
                    let bulletRemoved = false;
                    for (let j = asteroids.length - 1; j >= 0; j--) {
                        const ast = asteroids[j];
                        const dist = Math.hypot(bullets[i].x - ast.x, bullets[i].y - ast.y);
                        
                        if (dist < ast.r + bullets[i].r) {
                            playSound('explosion');
                            createDebris(ast.x, ast.y, ast.isBehemoth ? '#ff33aa' : '#00ffff');
                            
                            let pointsEarned = 0;
                            if (ast.isBehemoth) pointsEarned = 600;
                            else if (ast.tier === 3) pointsEarned = 20;
                            else if (ast.tier === 2) pointsEarned = 50;
                            else pointsEarned = 100;

                            score += pointsEarned;

                            if (score >= nextExtraLifeScore) {
                                lives++;
                                nextExtraLifeScore += 10000;
                                for (let p = 0; p < 20; p++) {
                                    particles.push(new Particle(ship.x, ship.y, (Math.random()-0.5)*200, (Math.random()-0.5)*200, 0.6, '#00ffaa'));
                                }
                            }

                            updateHUD();

                            if (ast.tier > 1) {
                                const splitCount = (Math.random() < 0.55) ? 2 : 3;
                                for (let s = 0; s < splitCount; s++) {
                                    const newRadius = ast.r / (splitCount === 2 ? 2.0 : 2.4);
                                    if (newRadius > 10) {
                                        let speedMult = 1.0;
                                        if (currentDifficulty === 'crazy') speedMult = 1.4;
                                        if (currentDifficulty === 'insane') speedMult = 1.8;
                                        asteroids.push(new Asteroid(ast.x, ast.y, newRadius, ast.tier - 1, false, speedMult));
                                    }
                                }
                            }

                            asteroids.splice(j, 1);
                            bullets.splice(i, 1);
                            bulletRemoved = true;
                            break;
                        }
                    }
                    if (bulletRemoved) continue;
                }

                // Ship-Asteroid Collision
                if (ship.invulnerableTimer <= 0) {
                    for (let ast of asteroids) {
                        const dist = Math.hypot(ship.x - ast.x, ship.y - ast.y);
                        if (dist < ship.r + ast.r * 0.85) {
                            playSound('explosion');
                            createDebris(ship.x, ship.y, '#00ffff');
                            lives--;
                            updateHUD();
                            if (lives <= 0) {
                                triggerGameOver();
                            } else {
                                ship.x = canvas.width / 2;
                                ship.y = canvas.height / 2;
                                ship.vx = 0;
                                ship.vy = 0;
                                ship.invulnerableTimer = 3.0;
                            }
                            break;
                        }
                    }
                }

                // Wave Clear Check
                if (asteroids.length === 0) {
                    wave++;
                    spawnWave();
                    updateHUD();
                }
            }

            // Draw Entities
            for (let ast of asteroids) ast.draw();
            for (let b of bullets) b.draw();
            for (let p of particles) p.draw();
            if (gameStarted && !gameOver) ship.draw();

            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
